name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # CI validation only — actual deployment is handled by Vercel's own
      # GitHub integration (auto-deploys on every push to main), not this
      # workflow. This step just confirms the build is clean before/alongside
      # that deploy. See HANDOFF_Phase6-7.md's "Deploy wiring" section for
      # Vercel project setup (env vars, domain).
      #
      # Migrations are applied to production by hand via
      # scripts/run-migration.mjs (see HANDOFF_Phase6-7.md), not by
      # `drizzle-kit migrate` here — this repo's supabase/migrations/
      # directory has no meta/_journal.json (never generated by
      # `drizzle-kit generate`), so a `db:migrate` CI step can't run
      # unattended against production without first bootstrapping that
      # journal and baselining drizzle's migration-tracking table.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
